[project]
name = "gateway"
version = "0.1.0"
description = "API Gateway — JWT validation, routing, rate limiting"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9,<3",
    "httpx>=0.28,<1",
    "pyjwt>=2.12,<3",
    "structlog>=24,<26",
    "slowapi>=0.1.9,<1",
    "websockets>=15,<16",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1", "pytest-asyncio>=0.23,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
