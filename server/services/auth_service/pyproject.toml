[project]
name = "auth-service"
version = "0.1.0"
description = "Auth microservice — users, tokens, password flows"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9,<3",
    "email-validator>=2.1,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "psycopg2-binary>=2.9,<3",
    "alembic>=1.15,<2",
    "pyjwt>=2.12,<3",
    "passlib[bcrypt]>=1.7,<2",
    "bcrypt>=4.3,<5",
    "structlog>=24,<26",
    "redis[hiredis]>=5.3,<6",
    "python-multipart>=0.0.18,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1", "pytest-asyncio>=0.23,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
