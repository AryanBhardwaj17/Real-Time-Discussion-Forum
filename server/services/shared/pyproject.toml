[project]
name = "shared"
version = "0.1.0"
description = "Shared library for forum microservices"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115,<0.116",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9,<3",
    "pyjwt>=2.12,<3",
    "passlib[bcrypt]>=1.7,<2",
    "bcrypt>=4.3,<5",
    "structlog>=24,<26",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uuid-utils>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]
