# ═══════════════════════════════════════════════════════════════════════
# Microservices Docker Compose
# Usage: docker compose up --build
# ═══════════════════════════════════════════════════════════════════════

services:
  # ═════════════════════════════════════════════════════════════════
  # Frontend — React SPA served via nginx
  # ═════════════════════════════════════════════════════════════════
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: forum_frontend
    ports:
      - "3000:80"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ═════════════════════════════════════════════════════════════════
  # API Gateway — single entry point for all client traffic
  # ═════════════════════════════════════════════════════════════════
  gateway:
    build:
      context: ./server
      dockerfile: api_gateway/Dockerfile
    container_name: forum_gateway
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      DEBUG: ${DEBUG:-true}
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:5174","http://localhost:5175","http://localhost:5176","http://localhost:5177","http://localhost:5178","http://localhost:5179","http://localhost:5180"]'
      AUTH_SERVICE_URL: http://auth:8001
      CONTENT_SERVICE_URL: http://content:8002
      NOTIFICATION_SERVICE_URL: http://notification:8003
      SEARCH_SERVICE_URL: http://search:8004
      DASHBOARD_SERVICE_URL: http://dashboard:8005
      REALTIME_SERVICE_URL: http://realtime:8006
    depends_on:
      auth:
        condition: service_healthy
      content:
        condition: service_healthy
      notification:
        condition: service_started
      search:
        condition: service_started
      dashboard:
        condition: service_started
      realtime:
        condition: service_started
    volumes:
      - ./server/api_gateway/logs:/var/log/forum
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ═════════════════════════════════════════════════════════════════
  # Auth Service — users, tokens, password flows
  # ═════════════════════════════════════════════════════════════════
  auth:
    build:
      context: ./server/services
      dockerfile: auth_service/Dockerfile
    container_name: forum_auth
    environment:
      DATABASE_URL: postgresql+asyncpg://forum_user:${POSTGRES_PASSWORD:-forum_pass}@postgres_auth:5432/auth_db
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REDIS_URL: redis://:${REDIS_PASSWORD:-forum_redis_pass}@redis:6379/0
      DEBUG: ${DEBUG:-true}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@forum.dev}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-Admin@1234}  # SECURITY: override in production .env
      INTERNAL_SECRET: ${INTERNAL_SECRET:-forum_internal_secret}
    depends_on:
      postgres_auth:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server/services/auth_service/logs:/var/log/forum
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ═════════════════════════════════════════════════════════════════
  # Content Service — threads, comments, likes, reports
  # ═════════════════════════════════════════════════════════════════
  content:
    build:
      context: ./server/services
      dockerfile: content_service/Dockerfile
    container_name: forum_content
    environment:
      DATABASE_URL: postgresql+asyncpg://forum_user:${POSTGRES_PASSWORD:-forum_pass}@postgres_content:5432/content_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-forum_redis_pass}@redis:6379/0
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-forum_meili_master_key}
      NOTIFICATION_SERVICE_URL: http://notification:8003
      DEBUG: ${DEBUG:-true}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-forum_internal_secret}
    depends_on:
      postgres_content:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    volumes:
      - ./server/services/content_service/logs:/var/log/forum
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ═════════════════════════════════════════════════════════════════
  # Notification Service — in-app notifications
  # ═════════════════════════════════════════════════════════════════
  notification:
    build:
      context: ./server/services
      dockerfile: notification_service/Dockerfile
    container_name: forum_notification
    environment:
      DATABASE_URL: postgresql+asyncpg://forum_user:${POSTGRES_PASSWORD:-forum_pass}@postgres_notification:5432/notification_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-forum_redis_pass}@redis:6379/0
      DEBUG: ${DEBUG:-true}
    depends_on:
      postgres_notification:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server/services/notification_service/logs:/var/log/forum
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ═════════════════════════════════════════════════════════════════
  # Search Service — Meilisearch-backed full-text search
  # ═════════════════════════════════════════════════════════════════
  search:
    build:
      context: ./server/services
      dockerfile: search_service/Dockerfile
    container_name: forum_search
    environment:
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-forum_meili_master_key}
      DEBUG: ${DEBUG:-true}
    depends_on:
      meilisearch:
        condition: service_healthy
    volumes:
      - ./server/services/search_service/logs:/var/log/forum
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ═════════════════════════════════════════════════════════════════
  # Dashboard Service — stats, audit log, activity feeds
  # ═════════════════════════════════════════════════════════════════
  dashboard:
    build:
      context: ./server/services
      dockerfile: dashboard_service/Dockerfile
    container_name: forum_dashboard
    environment:
      DATABASE_URL: postgresql+asyncpg://forum_user:${POSTGRES_PASSWORD:-forum_pass}@postgres_dashboard:5432/dashboard_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-forum_redis_pass}@redis:6379/0
      AUTH_SERVICE_URL: http://auth:8001
      CONTENT_SERVICE_URL: http://content:8002
      DEBUG: ${DEBUG:-true}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-forum_internal_secret}
    depends_on:
      postgres_dashboard:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server/services/dashboard_service/logs:/var/log/forum
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ═════════════════════════════════════════════════════════════════
  # Realtime Service — WebSocket + Redis Pub/Sub bridge
  # ═════════════════════════════════════════════════════════════════
  realtime:
    build:
      context: ./server/services
      dockerfile: realtime_service/Dockerfile
    container_name: forum_realtime
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-forum_redis_pass}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      DEBUG: ${DEBUG:-true}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./server/services/realtime_service/logs:/var/log/forum
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ═════════════════════════════════════════════════════════════════
  # Infrastructure — PostgreSQL (one instance per service)
  # ═════════════════════════════════════════════════════════════════
  postgres_auth:
    image: postgres:16-alpine
    container_name: forum_postgres_auth
    environment:
      POSTGRES_USER: forum_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forum_pass}
      POSTGRES_DB: auth_db
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forum_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  postgres_content:
    image: postgres:16-alpine
    container_name: forum_postgres_content
    environment:
      POSTGRES_USER: forum_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forum_pass}
      POSTGRES_DB: content_db
    volumes:
      - postgres_content_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forum_user -d content_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  postgres_notification:
    image: postgres:16-alpine
    container_name: forum_postgres_notification
    environment:
      POSTGRES_USER: forum_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forum_pass}
      POSTGRES_DB: notification_db
    volumes:
      - postgres_notification_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forum_user -d notification_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  postgres_dashboard:
    image: postgres:16-alpine
    container_name: forum_postgres_dashboard
    environment:
      POSTGRES_USER: forum_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forum_pass}
      POSTGRES_DB: dashboard_db
    volumes:
      - postgres_dashboard_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forum_user -d dashboard_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # ═════════════════════════════════════════════════════════════════
  # Infrastructure — Redis, Meilisearch
  # ═════════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: forum_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-forum_redis_pass}
    # ports:
    #   - "6379:6379"  # Only expose for local debugging
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "forum_redis_pass", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: forum_meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-forum_meili_master_key}
      MEILI_ENV: development
    # ports:
    #   - "7700:7700"  # Only expose for local debugging
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_auth_data:
  postgres_content_data:
  postgres_notification_data:
  postgres_dashboard_data:
  redis_data:
  meili_data:
